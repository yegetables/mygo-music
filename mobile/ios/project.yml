name: MyGoMusic
options:
  bundleIdPrefix: dev.egoist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  MyGoMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.egoist.music
        PRODUCT_NAME: MyGoMusic
        MARKETING_VERSION: "0.1.25"
        CURRENT_PROJECT_VERSION: "25"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        ARCHS: arm64
        SUPPORTED_PLATFORMS: iphoneos
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MyGoMusic-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-lmygocore"
          - "-lresolv"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: Photos.framework
      - sdk: UniformTypeIdentifiers.framework
